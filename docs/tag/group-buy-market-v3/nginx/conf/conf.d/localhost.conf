#负载策略 ：默认轮询（round-robin）
# 拼团市场服务集群（负载均衡）
upstream backend_servers_group_buy_market {
    server 192.168.100.8:8091;
    server 192.168.100.8:8092;
}

# 小型支付商城服务
upstream backend_servers_s_pay_mall {
    server 192.168.100.8:8093;
}

server {
    listen 80;

    server_name 192.168.100.8;  # 修改为你的实际服务器 IP 或域名【域名需要备案】

    location /api/v1/gbm/ {
        proxy_pass http://backend_servers_group_buy_market;  # 将请求代理到上游服务器组
        proxy_set_header Host $host; #保持原始请求的 Host 头
        proxy_set_header X-Real-IP $remote_addr; #传递真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #记录代理链路中的所有 IP
        proxy_set_header X-Forwarded-Proto $scheme; #传递原始协议（http/https）
    }

    location /api/v1/alipay/ {
        proxy_pass http://backend_servers_s_pay_mall;  # 将请求代理到上游服务器组
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/login/ {
        proxy_pass http://backend_servers_s_pay_mall;  # 将请求代理到上游服务器组
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     location /api/v1/weixin/ {
        proxy_pass http://backend_servers_s_pay_mall;  # 将请求代理到上游服务器组
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源处理
    location / {
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}